schema: spec-driven

# Project context
context: |
  Tech stack:
    - Backend: SpacetimeDB (TypeScript server module)
    - Frontend: React + TypeScript + Vite
    - Styling: CSS with custom properties (green/black theme)
    - Authentication: Switchable between SpacetimeAuth (OIDC) and anonymous mode

  Architecture:
    - Real-time chat application with SpacetimeDB subscriptions
    - Tables: user, message, message_like
    - Reducers handle all data mutations (transactional, deterministic)
    - Client uses module_bindings generated from server

  Conventions:
    - Follow CLAUDE.md instructions (SpacetimeDB rules in project root)
    - Reducer calls use object syntax, not positional args
    - BigInt for all u64/i64 fields (use 0n, 1n, not 0, 1)
    - Index names use exact snake_case from schema
    - Feature flags for toggleable features

  Domain: Real-time chat with authentication, message likes, online presence

# Per-artifact rules
rules:
  proposal:
    - Reference CLAUDE.md for SpacetimeDB constraints
    - Identify if backend (SpacetimeDB module) or frontend changes
  specs:
    - Use Given/When/Then format for scenarios
    - Mark breaking changes clearly
  design:
    - Consider SpacetimeDB determinism requirements (no random, no network in reducers)
    - Specify if using reducers, views, or procedures
  tasks:
    - Separate backend tasks (spacetimedb/) from frontend tasks (src/)
    - Include `spacetime publish` and `spacetime generate` steps when backend changes
